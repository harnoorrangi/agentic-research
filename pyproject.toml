[project]
name = "agentic-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "pydantic",
    "pydantic-ai",
    "qdrant-client",
    "duckduckgo-search",
    "trafilatura",
    "sentence-transformers",
    "numpy",
    "typer",
    "rich",
    "loguru>=0.7.3",
]

[project.scripts]
agentic-research = "agentic_research:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nox>=2025.5.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]
